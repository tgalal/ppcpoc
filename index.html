<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contact</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #f6f6f8;
  --card: #ffffff;
  --ink: #16161a;
  --muted: #6b6b76;
  --line: rgba(22, 22, 26, .09);
  --accent: #4f46e5;
  --accent-ink: #ffffff;
  --danger: #b3261e;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(16,16,20,.05), 0 8px 24px rgba(16,16,20,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131316;
    --card: #1c1c21;
    --ink: #f2f2f5;
    --muted: #a0a0ad;
    --line: rgba(255, 255, 255, .10);
    --accent: #8b85f5;
    --accent-ink: #16161a;
    --danger: #f2b8b5;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: max(16px, env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: center;
}
.wrap { width: 100%; max-width: 30rem; }
[hidden] { display: none !important; }

/* ---------- states that are not the profile ---------- */
.panel {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 32px 24px;
  text-align: center;
  margin-top: 12vh;
}
.panel h1 { font-size: 1.15rem; margin: 0 0 8px; letter-spacing: -.01em; }
.panel p { margin: 0; color: var(--muted); font-size: .95rem; }
.panel .glyph {
  width: 44px; height: 44px; margin: 0 auto 16px;
  color: var(--muted);
}
#error .glyph { color: var(--danger); }
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- loading skeleton ---------- */
.card.skeleton { animation: breathe 1.6s ease-in-out infinite; }

/* Hybrid mode: the avatar breathes while the offline placeholder it's
   showing (initials, or an offline photo) is still waiting to be
   replaced by whatever the live phone connection sends. */
.avatar.loading { animation: breathe 1.6s ease-in-out infinite; }

@keyframes breathe {
  0%, 100% { opacity: 1; }
  50%      { opacity: .55; }
}
@media (prefers-reduced-motion: reduce) {
  .card.skeleton, .avatar.loading { animation-duration: 4.8s; }
}

.ph-block, .ph-line { background: var(--line); }
.avatar.ph-block { background: var(--line); }
.ph-glyph { border-radius: 50%; }
.ph-line { border-radius: 6px; }

.ph-name  { width: 55%; height: 20px; margin: 14px auto 8px; }
.ph-role  { width: 35%; height: 14px; margin: 0 auto; }
.ph-value { width: 70%; height: 14px; margin-bottom: 6px; }
.ph-label { width: 40%; height: 11px; }

/* ---------- the profile ---------- */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.hero { padding: 32px 24px 24px; text-align: center; }
.avatar {
  width: 96px; height: 96px; margin: 0 auto 16px;
  border-radius: 50%; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; font-weight: 600; letter-spacing: .02em;
  color: #fff; background: var(--accent);
  box-shadow: 0 4px 16px rgba(16,16,20,.14);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.name { font-size: 1.55rem; font-weight: 650; margin: 0; letter-spacing: -.02em; line-height: 1.2; }
.role { margin: 6px 0 0; color: var(--muted); font-size: .95rem; }

.rows { list-style: none; margin: 0; padding: 0 8px 8px; }
.rows li + li { border-top: 1px solid var(--line); }
.row {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 16px; text-decoration: none; color: inherit;
  border-radius: 12px;
}
a.row:active { background: var(--line); }
.row .glyph { width: 20px; height: 20px; flex: none; color: var(--muted); }
.row .text { min-width: 0; flex: 1; }
.row .value {
  font-size: 1rem; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  overflow: hidden;
}
/* A note is prose and deserves the room; everything else is an identifier. */
.row.note .value { -webkit-line-clamp: 6; }
a.row .value { color: var(--accent); }
.row .label {
  font-size: .75rem; color: var(--muted); text-transform: uppercase;
  letter-spacing: .05em; margin-top: 1px;
}

.actions { padding: 4px 24px 24px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 15px 20px;
  font: inherit; font-weight: 600;
  border: 0; border-radius: 14px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
  text-decoration: none;
}
.btn:active { opacity: .85; }
.btn .glyph { width: 20px; height: 20px; }
.btn + .btn.ghost { margin-top: 10px; }
.btn .spinner {
  display: none;
  width: 18px; height: 18px; flex: none;
  border: 2px solid color-mix(in srgb, var(--accent-ink) 30%, transparent);
  border-top-color: var(--accent-ink);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
.btn[aria-busy="true"] { opacity: .85; cursor: progress; }
.btn[aria-busy="true"] .glyph { display: none; }
.btn[aria-busy="true"] .spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.1s; } }
.hint { margin: 10px 0 0; text-align: center; font-size: .8rem; color: var(--muted); }

/* ---------- sending one back ---------- */
.reply { margin-top: 16px; padding: 22px 24px 24px; }
.reply h2 { font-size: 1rem; font-weight: 650; margin: 0 0 4px; letter-spacing: -.01em; }
.reply .sub { margin: 0 0 16px; font-size: .875rem; color: var(--muted); }
.field { margin-bottom: 12px; }
.field label {
  display: block; font-size: .75rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: .05em; margin-bottom: 5px;
}
.field input {
  width: 100%; padding: 12px 14px; font: inherit;
  color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 12px;
  -webkit-appearance: none; appearance: none;
}
.field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.btn.ghost {
  background: transparent; color: var(--accent);
  border: 1px solid var(--line); margin-bottom: 14px;
}
.btn[disabled] { opacity: .5; cursor: default; }
.reply .done { text-align: center; padding: 8px 0 4px; }
.reply .done .tick {
  width: 40px; height: 40px; margin: 0 auto 12px; color: var(--accent);
}
.err { margin: 10px 0 0; font-size: .85rem; color: var(--danger); text-align: center; }

.foot { margin: 18px 0 8px; text-align: center; font-size: .75rem; color: var(--muted); }
.foot code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

/* Timings, only with ?verbose */
#timings { width: 100%; margin-top: 16px; border-collapse: collapse; font-size: .8rem;
           font-variant-numeric: tabular-nums; color: var(--muted); }
#timings td { padding: 2px 0; }
#timings td.n { text-align: right; }
</style>
</head>
<body>
<div class="wrap">

  <!-- icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <g id="i-phone" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/>
      </g>
      <g id="i-mail" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/>
      </g>
      <g id="i-link" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </g>
      <g id="i-pin" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
      </g>
      <g id="i-org" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </g>
      <g id="i-note" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 4h16v12l-4 4H4z"/><path d="M20 16h-4v4"/>
      </g>
      <g id="i-cake" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="2"/>
        <path d="M8 3v4M16 3v4M3 11h18"/>
      </g>
      <g id="i-save" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
      </g>
      <g id="i-person" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
      </g>
      <g id="i-send" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12h13"/><path d="m12 6 6 6-6 6"/>
      </g>
      <g id="i-tick" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.5 2.5 5.5-5.5"/>
      </g>
      <g id="i-warn" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 16.5v.5"/>
      </g>
    </defs>
  </svg>

  <!-- loading -->
  <section id="loading">
    <p class="sr-only" role="status">Loading contact…</p>
    <div class="card skeleton" aria-hidden="true">
      <div class="hero">
        <div class="avatar ph-block"></div>
        <div class="ph-line ph-name"></div>
        <div class="ph-line ph-role"></div>
      </div>
      <ul class="rows">
        <li class="row">
          <div class="glyph ph-block ph-glyph"></div>
          <div class="text">
            <div class="ph-line ph-value"></div>
            <div class="ph-line ph-label"></div>
          </div>
        </li>
        <li class="row">
          <div class="glyph ph-block ph-glyph"></div>
          <div class="text">
            <div class="ph-line ph-value"></div>
            <div class="ph-line ph-label"></div>
          </div>
        </li>
        <li class="row">
          <div class="glyph ph-block ph-glyph"></div>
          <div class="text">
            <div class="ph-line ph-value"></div>
            <div class="ph-line ph-label"></div>
          </div>
        </li>
      </ul>
    </div>
  </section>

  <!-- error -->
  <section id="error" class="panel" hidden>
    <svg class="glyph" aria-hidden="true"><use href="#i-warn"/></svg>
    <h1 id="error-title"></h1>
    <p id="error-detail"></p>
  </section>

  <!-- the contact -->
  <main id="profile" hidden>
    <div class="card">
      <div class="hero">
        <div class="avatar" id="avatar"></div>
        <h1 class="name" id="fn"></h1>
        <p class="role" id="role" hidden></p>
      </div>
      <ul class="rows" id="rows"></ul>
      <div class="actions">
        <a class="btn" id="save" href="#">
          <svg class="glyph" aria-hidden="true"><use href="#i-save"/></svg>
          <span class="spinner" aria-hidden="true"></span>
          <span class="label">Save to contacts</span>
        </a>
        <p class="hint" id="save-hint" hidden></p>
      </div>
    </div>
    <section class="card reply" id="reply" hidden>
      <h2>Send yours back</h2>
      <p class="sub" id="reply-sub">So they have your details too.</p>

      <form id="reply-form" novalidate>
        <!-- Chrome on Android only. Hidden unless navigator.contacts exists,
             which is a capability check rather than a try/catch because the
             button should not be offered where it cannot work. -->
        <button class="btn ghost" id="pick-contact" type="button" hidden>
          <svg class="glyph" aria-hidden="true"><use href="#i-person"/></svg>
          <span>Use a contact</span>
        </button>

        <div class="field">
          <label for="reply-name">Name</label>
          <!-- autocomplete is what makes iOS Safari offer AutoFill from the
               user's own card, which is the nearest thing iOS has to a picker. -->
          <input id="reply-name" name="name" type="text" autocomplete="name"
                 enterkeyhint="next" required>
        </div>
        <div class="field">
          <label for="reply-tel">Phone</label>
          <input id="reply-tel" name="tel" type="tel" inputmode="tel"
                 autocomplete="tel" enterkeyhint="send">
        </div>

        <button class="btn" id="reply-send" type="submit">
          <svg class="glyph" aria-hidden="true"><use href="#i-send"/></svg>
          <span class="spinner" aria-hidden="true"></span>
          <span class="label">Send</span>
        </button>
        <p class="err" id="reply-error" hidden></p>
      </form>

      <div class="done" id="reply-done" hidden>
        <svg class="tick" aria-hidden="true"><use href="#i-tick"/></svg>
        <h2 id="reply-done-title">Sent</h2>
        <p class="sub" style="margin:4px 0 0" id="reply-done-sub"></p>
      </div>
    </section>

    <p class="foot">Sent directly from the sender's phone. Nothing was stored on a server.</p>
  </main>

  <table id="timings" hidden><tbody></tbody></table>
</div>

<script src="wasm_exec.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
